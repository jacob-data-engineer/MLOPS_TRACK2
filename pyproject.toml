[project]
name = "track2-mlops"
version = "0.1.0"
description = "Track2 YOLO retraining platform: a FastAPI backend and React SPA over the pull, dataset, training and registry pipelines."
readme = "README.md"
authors = [
    { name = "Hanster", email = "shalihan.othman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # 1.35.2 is the first version whose put_object supports the
    # IfMatch/IfNoneMatch conditional-write parameters the pull-control
    # settings rely on for compare-and-swap.
    "boto3>=1.35.2",
    # The React frontend's backend (ppe_pipeline_api).
    "fastapi>=0.141.1",
    # FastAPI needs this to parse multipart/form-data. Not imported by
    # our code, so it looks removable and is not:
    # POST /track2/models/base-models/upload takes File/Form, and without
    # it FastAPI raises at request time, not at import.
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    # Read directly by track2_shared (a dataset's data.yaml decides which
    # pipeline may train on it), not just transitively via ultralytics.
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    # Registering a checkpoint opens it and slices the detection head down
    # to the chosen classes, which needs torch and ultralytics in this
    # image. Pinned to the CPU wheel index in [tool.uv.sources] below.
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.3.0",
    "uvicorn>=0.51.0",
    "pg8000>=1.31",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# uv_build looks for the module at `src/<normalised project name>`, which
# would be `src/track2_mlops`. The package is `ppe_pipeline_api` and
# renaming it would churn every import, the Dockerfile ENTRYPOINT and the
# Lambda handlers for no gain, so point the backend at it instead.
#
# This went wrong once: deleting `src/ppe_pipeline` while the project was
# still called `ppe-pipeline` left the backend looking for a directory
# that no longer existed. Every test passed, the app imported, the
# frontend compiled -- and the Docker build died on `uv sync --locked`,
# which is the only place the project gets BUILT rather than imported.
module-name = "ppe_pipeline_api"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
# No git dependencies at all now. Track1 went first; `aiops-pipeline`
# (SNAIC-JP/Track2) followed when the PPE judge was retired -- it was
# imported only by `ppe_pipeline/track2_status.py`, which nothing
# imported. Nothing in the TRAINING path ever came from it: the pipeline
# definition is `model_training/custom_training/pipeline_open.json` and
# the trainer is `model_training/training-container/train.py`, both here.
#
# So this repo now builds with no access to any other repository.

[[tool.uv.index]]
# CPU-only torch wheels. Nothing in this app trains or infers locally --
# torch is here because ultralytics needs it to open a checkpoint and
# slice its detection head. The default Linux torch wheel is the CUDA
# build, which would add gigabytes to an image that has no GPU.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
